<main>
  <section class="reservation-section">
    <!--header-->
    <div class="container-fluid reservation-header text-center py-4 header-orange">
      <h3 class="mb-0">
        <span class="title">Reserve Your Table</span><br>
        <span class="subtitle">Timeless Filipino flavors, beautifully reimagined</span>
      </h3>
    </div>

    <!--reservation form -->
    <div class="container-fluid reservation-bg pt-3 pb-5">
      <!--stepper-->
      <div class="container mt-0 mb-4">
        <div class="d-flex justify-content-center align-items-center stepper">
          <div class="step" [class.completed]="currentStep > 1">
            <div class="step-circle">1</div><small>Details</small>
          </div>
          <div class="step-line" [class.active]="currentStep > 1"></div>
          <div class="step" [class.completed]="currentStep > 2">
            <div class="step-circle">2</div><small>Food Package</small>
          </div>
          <div class="step-line" [class.active]="currentStep > 2"></div>
          <div class="step" [class.active]="currentStep === 3" [class.completed]="currentStep > 3">
            <div class="step-circle">3</div><small>Payment</small>
          </div>
          <div class="step-line" [class.active]="currentStep > 3"></div>
          <div class="step" [class.active]="currentStep === 4">
            <div class="step-circle">4</div><small>Confirm</small>
          </div>
        </div>
      </div>

      <!--form header-->
      <div class="container reservation-header text-start py-3 rounded-top-4 form-header">
        <h3 class="mb-0"><span class="title text-white p-3">Select Payment Method</span></h3>
      </div>

      <!--form container-->
      <div class="container rounded-bottom shadow-lg form-container-payment">
        <div class="d-grid gap-2 m-2 p-3">
          
          <!--payment method buttons-->
          <button 
            *ngFor="let method of paymentMethods"
            class="btn text-start p-4 button-custom shadow-lg d-flex align-items-center border-0 payment-method-btn"
            type="button"
            [disabled]="method.disabled"
            [style.background-color]="method.disabled ? '#e9ecef' : ''"
            [class.selected]="selectedPaymentMethod === method.id"
            (click)="selectPaymentMethod(method)">
            <i [class]="method.icon + ' me-2 payment-icon'"></i>
            <span>{{ method.title }} ({{ method.description }})</span>
          </button>

        </div>

        <!--btn group-->
        <div class="d-flex gap-2 p-3 w-100">
          <button class="btn btn-primary flex-fill btn-back-payment" type="button" (click)="onBack()">
            Back
          </button>
          <button class="btn btn-danger flex-fill" type="button" (click)="onCancel()">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </section>
</main>

<!--unavailable modal -->
<div class="modal fade" [class.show]="showUnavailableModal" [style.display]="showUnavailableModal ? 'block' : 'none'" 
     tabindex="-1" *ngIf="showUnavailableModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header text-white modal-header-orange">
        <h5 class="modal-title">
          <i class="bi bi-exclamation-circle-fill me-2"></i>
          Payment Method Unavailable
        </h5>
        <button type="button" class="btn-close btn-close-white" (click)="closeUnavailableModal()"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0">{{ unavailableMessage }}</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-custom btn-modal-ok" (click)="closeUnavailableModal()">
          <i class="bi bi-check-circle me-1"></i> OK
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade" [class.show]="showUnavailableModal" *ngIf="showUnavailableModal"></div>

<!--Confirmation Modal -->
<div class="modal fade" [class.show]="showCancelModal" [style.display]="showCancelModal ? 'block' : 'none'" 
     tabindex="-1" *ngIf="showCancelModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header modal-header-warning">
        <h5 class="modal-title">
          <i class="bi bi-exclamation-triangle-fill me-2"></i> Warning
        </h5>
        <button type="button" class="btn-close btn-close-white" (click)="closeCancelModal()"></button>
      </div>
      <div class="modal-body modal-body-large">
        Are you sure you want to cancel? Your changes won't be saved.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeCancelModal()">No</button>
        <button type="button" class="btn btn-danger" (click)="confirmCancel()">Yes</button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade" [class.show]="showCancelModal" *ngIf="showCancelModal"></div>
