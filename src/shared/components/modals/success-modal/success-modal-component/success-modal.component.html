@if (show) {
<div 
  class="modal fade"
  [class.show]="show"
  [style.display]="show ? 'block' : 'none'"
  id="successModal" 
  tabindex="-1" 
  data-bs-backdrop="static" 
  data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header modal-header-success">
        <h5 class="modal-title text-white w-100 text-center">
          <i class="bi bi-check-circle-fill me-2 success-icon"></i>
          <br>
          Reservation Confirmed!
        </h5>
      </div>
      <div class="modal-body text-center py-4">
        <p class="mb-3 fs-5">Thank you for reserving with us!</p>
        <p class="mb-0">We will send an e-receipt to:</p>
        <p class="fw-bold text-primary">{{ email }}</p>
        <hr>
        <small class="text-muted">Please check your email for confirmation details.</small>
      </div>
      <div class="modal-footer justify-content-center border-0">
        <button 
          type="button" 
          class="btn btn-primary px-4 btn-home" 
          (click)="onGoHome()">
          <i class="bi bi-house-fill me-2"></i>Back to Home
        </button>
      </div>
    </div>
  </div>
</div>
}

@if (show) {
<div 
  class="modal-backdrop fade" 
  [class.show]="show">
</div>
}
