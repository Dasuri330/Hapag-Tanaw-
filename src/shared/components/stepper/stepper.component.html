<nav aria-label="Reservation progress" class="container mt-0 mb-4">
  <ol class="d-flex justify-content-center align-items-center stepper list-unstyled mb-0">
    @for (step of steps; track step.number; let last = $last) {
      <!-- Step Item -->
      <li class="step" 
          [class.active]="currentStep === step.number && (step.number !== 4 || !isConfirmed)"
          [class.completed]="currentStep > step.number || (step.number === 4 && isConfirmed)"
          [attr.aria-current]="currentStep === step.number ? 'step' : null">
        <div class="step-circle" aria-hidden="true">{{ step.number }}</div>
        <small>{{ step.label }}</small>
      </li>

      <!-- Step Line (not after last step) -->
      @if (!last) {
        <li class="step-line" 
            [class.active]="currentStep > step.number || (step.number === 4 && isConfirmed)"
            aria-hidden="true">
        </li>
      }
    }
  </ol>
</nav>
