<main>
  <section class="hero-section">
    <div class="container-fluid p-3 text-dark mt-n1">
      <h3>From Our Kitchen to Your Table Menu Awaits!</h3>
    </div>    
  </section>

  <!--section navbar-->
  <app-section-navbar 
    [sections]="sectionNavItems"
    [actionButton]="reserveButton"
    (navbarReady)="onNavbarReady($event)">
  </app-section-navbar>

  @if (isLoading) {
    <div class="text-center my-5 py-5">
      <div class="spinner-border text-primary custom-spinner" role="status"></div>
      <p class="mt-3 text-muted">Loading menu please wait.</p>
    </div>
  } @else {
    @for (section of menuSections; track section.id) {
      <section [id]="section.id" class="menu-section">
        <div class="container-fluid my-1 p-3 text-dark mb-5">
          <h4 class="mb-4 ms-2">{{ section.title }}</h4>
          <div class="card-group">
            @for (item of section.items; track item.title) {
              <div class="card">
                <img [src]="item.image"
                     class="card-img-top"
                     [alt]="item.title">
                <div class="card-body">
                  <h5 class="card-title">{{ item.title }}</h5>
                  <p class="card-text">{{ item.description }}</p>
                  <p class="card-text"><small>₱ {{ item.price }}</small></p>
                </div>
              </div>
            }
          </div>
        </div>
      </section>
    }
  }
</main>
