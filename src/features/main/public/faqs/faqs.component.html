<!--main content-->
<main>
  <!--hero section-->
  <section class="hero-section">
    <div class="container-fluid mt-1 p-3 text-dark shadow-5">
      <div class="row align-items-center">
        <h3>Frequently Asked <span class="highlight">Questions</span></h3>
      </div>
      <div class="container my-3 p-5 shadow-lg rounded border-5">
        <div class="row align-items-center">
          
          @if (faqs$ | async; as faqs) {
            <div class="accordion" id="accordionExample">
              @for (faq of faqs; track faq.id) {
                <div class="accordion-item">
                  <h2 class="accordion-header" [id]="'heading' + faq.id">
                    <button 
                      class="accordion-button collapsed" 
                      type="button" 
                      [attr.data-bs-toggle]="'collapse'" 
                      [attr.data-bs-target]="'#collapse' + faq.id" 
                      [attr.aria-expanded]="'false'" 
                      [attr.aria-controls]="'collapse' + faq.id">
                      <strong>{{ faq.question }}</strong>
                    </button>
                  </h2>
                  <div 
                    [id]="'collapse' + faq.id" 
                    class="accordion-collapse collapse" 
                    [attr.aria-labelledby]="'heading' + faq.id" 
                    [attr.data-bs-parent]="'#accordionExample'">
                    <div class="accordion-body" [innerHTML]="faq.answer"></div>
                  </div>
                </div>
              }
            </div>
          } @else {
            <div class="text-center p-5">
              <p>Loading FAQs...</p>
            </div>
          }

        </div>
      </div>
    </div>
  </section>
</main>
