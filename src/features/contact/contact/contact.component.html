<!--Main Section-->
    <main>
        <!--location section-->
        <section class="location-section">
            <div class="container mb-1">
                <!--section-->
                <div class="text-center mb-1">
                    <h3 class="location-title">We are located at</h3>
                </div>
                
                <!-- contact and address information-->
                <div class="container shadow-lg w-80 p-3 mt-n5 custom-border">
                    <div class="row align-items-center">
                        <div class="col-lg-6 mb-4 mb-lg-0">
                            <div class="contact-info">
                                <div class="contact-item">
                                    <div class="contact-icon location-icon">
                                        <fa-icon [icon]="faLocationDot"></fa-icon>
                                    </div>
                                    <div class="contact-text">
                                        Upper Ground Floor, SM, SJDM, 3023 Bulacan
                                    </div>
                                </div>
                                <!--phone-->
                                <div class="contact-item">
                                    <div class="contact-icon phone-icon">
                                        <fa-icon [icon]="faPhone"></fa-icon>
                                    </div>
                                    <div class="contact-text">
                                        02-111-32456 / 09137736621
                                    </div>
                                </div>
                                
                                <!--email-->
                                <div class="contact-item">
                                    <div class="contact-icon envelope-icon">
                                        <fa-icon [icon]="faEnvelope"></fa-icon>
                                    </div>
                                    <div class="contact-text">
                                        hapagtbusiness@gmail.com
                                    </div>
                                </div>
                            </div>
                            
                            <!--social media-->
                            <div class="social-media-section text-center">
                                <h3 class="social-title mt-3">Our Social Media</h3>
                                <div class="social-icons">
                                    <a href="https://www.facebook.com/dexter.cabubas" class="social-icon facebook" target="_blank">
                                        <fa-icon [icon]="faFacebook"></fa-icon>
                                    </a>
                                    <a href="https://www.instagram.com/lostintokyo____/?hl=en" class="social-icon instagram" target="_blank">
                                        <fa-icon [icon]="faInstagram"></fa-icon>
                                    </a>
                                    <a href="https://www.tiktok.com/@dexithings?is_from_webapp=1&sender_device=pc" class="social-icon tiktok" target="_blank">
                                        <fa-icon [icon]="faTikTok"></fa-icon>
                                    </a>
                                </div>
                            </div>
                        </div>
                        
                        <!--map section-->
                        <div class="col-lg-6">
                            <div class="map-container">
                                <iframe 
                                    src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d3048.9856546669494!2d121.07251267510979!3d14.786190885722494!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1ssm%20tungko%20san%20jose%20del%20monte!5e1!3m2!1sen!2sph!4v1765951720912!5m2!1sen!2sph" 
                                    width="600" 
                                    height="400" 
                                    allowfullscreen="" 
                                    loading="lazy" 
                                    referrerpolicy="no-referrer-when-downgrade">
                                </iframe>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
