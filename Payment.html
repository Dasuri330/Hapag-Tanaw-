    <!--Main Content-->
    <main>
      <section class="reservation-section">
        <!-- Title / Banner -->
        <div
          class="container-fluid reservation-header text-center py-4"
          style="background-color: #d27d2d"
        >
          <h3 class="mb-0">
            <span class="title">Reserve Your Table</span><br />
            <span class="subtitle"
              >Timeless Filipino flavors, beautifully reimagined</span
            >
          </h3>
        </div>

        <!-- Background area -->
        <div class="container-fluid reservation-bg pt-3 pb-5">
          <!-- stepper -->
          <div class="container mt-0 mb-4">
            <div
              class="d-flex justify-content-center align-items-center stepper"
            >
              <div class="step active">
                <div class="step-circle">1</div>
                <small>Details</small>
              </div>

              <div class="step-line"></div>

              <div class="step">
                <div class="step-circle">2</div>
                <small>Food Package</small>
              </div>

              <div class="step-line"></div>

              <div class="step">
                <div class="step-circle">3</div>
                <small>Payment</small>
              </div>

              <div class="step-line"></div>

              <div class="step">
                <div class="step-circle">4</div>
                <small>Confirm</small>
              </div>
            </div>
          </div>

          <!-- Title / Banner -->
          <div
            class="container reservation-header text-start py-3 rounded-top-4"
            style="background-color: #d27d2d; position: relative; z-index: 2"
          >
            <h3 class="mb-0">
              <span class="title text-white p-3">Payment Method</span>
            </h3>
          </div>

          <!-- Form Container-->
          <div
            class="container rounded-bottom shadow-lg"
            style="background-color: #f5f5dc; margin-top: -10px; position: relative; max-height: 550px; padding: 0;">
           <div class="d-grid gap-2 m-2 p-3">
            
              <button class="btn text-start p-3 button-custom shadow-lg border-0" type="button" id="creditCardBtn" aria-label="Disabled Credit/Debit Card" disabled style="background-color: #e9ecef;">
                <i class="bi bi-credit-card-fill me-2" style="color:#D27D2D;"></i><span>Credit/Debit Card (Pay with Visa, MasterCard or AMEX)</span>
              </button>
              <button id="gcashBtn"class="btn text-start p-3 button-custom shadow-lg d-flex align-items-center" type="button">
                 <i class="bi bi-wallet2 me-2" style="color:#D27D2D;"></i><span>Gcash (Quick and Secured mobile payment)</span></button>
                
      
              <button id="mayaBtn" class="btn text-start p-3 button-custom shadow-lg d-flex align-items-center" type="button">
                <i class="bi bi-wallet me-2" style="color:#D27D2D;"></i><span>Maya (Digital Walllet Payment)</span>
              </button>
              
              <button class="btn p-3 button-custom shadow-lg border-0 d-flex align-items-center" type="button" id="banktransferbtn" arial-label="Disble Bank Transfer" disabled style="background-color: #e9ecef;">
                <i class="bi bi-bank me-2" style="color:#D27D2D;"></i>
                <span>Bank Transfer (Direct Bank Deposit Transfer)</span>
              </button>
          </div>
          </div>
